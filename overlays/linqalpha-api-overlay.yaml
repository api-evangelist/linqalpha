- target: $.info
  update:
    x-apievangelist-contract-gaps:
    - id: missing-operation-ids
      detail: 37 of 48 operations declare no operationId; only the Briefing tag supplies them.
      impact: blocks Arazzo authoring, SDK generation, and reliable agent tool binding
    - id: no-idempotency
      detail: no Idempotency-Key header or parameter on any write operation
      impact: retried creates may duplicate briefings, source batches, and connectors
    - id: non-standard-errors
      detail: errors use a vendor envelope rather than RFC 9457 application/problem+json
    - id: no-contact-or-license-url
      detail: info block declares license name MIT with no url and carries no contact object
