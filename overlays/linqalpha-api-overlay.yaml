x-note: >-
  Captures API Evangelist's enrichment of the published LinqAlpha OpenAPI without mutating it.
  The largest real gap in the source document is missing operationIds: only 11 of 48 operations
  declare one, all of them under the Briefing tag. Every other operation must be addressed by
  method + path, which blocks Arazzo workflows, generated SDKs, and agent tool binding. That gap
  is recorded here rather than papered over — this overlay does not invent operationIds.
