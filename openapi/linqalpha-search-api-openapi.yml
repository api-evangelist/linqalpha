          description: Transcript block indices for this chunk.
    ApiErrorResponse:
      type: object
      description: Standard error response wrapper
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
        payload:
          description: Always null for error responses
          nullable: true
      required:
      - error
      - payload
    ThinkEvent:
      description: Thinking/reasoning process stream
      allOf:
      - $ref: '#/components/schemas/BaseSseEvent'
      - properties:
          event_name:
            enum:
            - think
          data:
            type: object
            required:
            - think_piece
            properties:
              think_piece:
                type: string
                description: A piece of the thinking/reasoning process (streamed incrementally)
                example: <PLAN_REASONING>
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
