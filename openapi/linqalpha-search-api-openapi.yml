          description: User ID. Required together with `user_email` for platform API keys to identify the specific user.
          example: user-123
        user_email:
          type: string
          format: email
          description: User email. Required together with `user_id` for platform API keys to identify the specific user.
          example: john.doe@example.com
      required:
      - query
    SearchRequest:
      type: object
