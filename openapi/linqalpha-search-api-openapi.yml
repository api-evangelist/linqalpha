          - news
          - ir_slide
          example:
          - transcript
          - filing
          - news
          - ir_slide
        top_k:
          type: number
          description: 'Specifies the number of top search results to return.

            If the value exceeds 50, it will be capped at 50

            The number of returned results will be less than or equal to the specified top_k value.

            Results are sorted by relevancy in descending order (from highest to lowest).'
          example: 50
        upload_period:
          type: object
          description: Filter documents by upload date range. At least one of start_time or end_time must be provided.
          properties:
            start_time:
