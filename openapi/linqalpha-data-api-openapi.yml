          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
      - Data
  /v1/map_tickers:
    get:
      summary: Map tickers to stock IDs
      description: Accepts a list of ticker strings via query parameters and returns their corresponding stock IDs (BBG IDs).
      parameters:
      - name: tickers
        in: query
        description: One or more ticker symbols to map. Can be repeated multiple times, e.g., `tickers=AAPL&tickers=GOOG`.
        required: true
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        example: tickers=AAPL&tickers=GOOG&tickers=MSFT&tickers=AMZN&tickers=TSLA&tickers=NVDA&tickers=META&tickers=NFLX&tickers=TSM&tickers=WMT
      responses:
        '200':
          description: Mapping results of tickers to stock IDs
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    nullable: true
                  payload:
                    type: array
                    items:
                      type: object
                      properties:
                        raw_ticker:
                          type: string
                        stock_id:
                          type: string
              example:
                error: null
                payload:
                - raw_ticker: AAPL
                  stock_id: BBG001S5N8V8
                - raw_ticker: GOOGL
                  stock_id: BBG009S39JY5
                - raw_ticker: MSFT
                  stock_id: BBG001S5TD05
                - raw_ticker: AMZN
                  stock_id: BBG001S5PQL7
                - raw_ticker: TSLA
                  stock_id: BBG001SQKGD7
                - raw_ticker: NVDA
                  stock_id: BBG001S5TZJ6
                - raw_ticker: META
                  stock_id: BBG001SQCQC5
        '400':
          description: Bad Request - if the provided ticker list is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: TICKERS_MISSING
                  msg: tickers query parameter is required
                  message: tickers query parameter is required
                payload: null
        '401':
          description: Unauthorized - Invalid API key or authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: API_KEY_MISSING
                  msg: header does not contain api key
                  message: header does not contain api key
                payload: null
        '500':
          description: Internal Server Error - if an unexpected error occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: SERVER_ERROR
                  message: An unexpected error occurred on the server.
                payload: null
      tags:
      - Data
  /v1/documents/{document_id}/presigned_url:
    get:
      summary: Presigned URL
      description: 'Generates a temporary presigned URL for secure access to the original document file.


        Provide a `document_id` (obtained from the References API) to receive a time-limited (10 min) URL that allows you to download or view the source document directly. This is useful when you need to access the actual file that was referenced in the search results.'
      parameters:
      - name: document_id
        in: path
        description: Document ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Presigned URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: Presigned URL
        '400':
          description: Bad Request - Missing or invalid document_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: DOCUMENT_ID_MISSING
                  msg: document_id is required
                  message: document_id is required
                payload: null
        '401':
          description: Unauthorized - Invalid API key or authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: API_KEY_MISSING
                  msg: header does not contain api key
                  message: header does not contain api key
                payload: null
      tags:
      - Data
  /v1/documents/batch_presigned_urls:
    get:
      summary: Batch Presigned URLs
      description: 'Generates temporary presigned URLs for multiple documents in a single request.


        Filter documents by ticker, document type, and date ranges. Returns paginated results with presigned URLs and document metadata.


        This is useful when you need to download multiple source documents at once, rather than calling the single-document presigned URL endpoint repeatedly.'
      parameters:
      - name: tickers
        in: query
        description: Ticker symbol(s) to filter by. At least one ticker or stock_id is required. Use multiple `tickers` params for multiple tickers (e.g., `?tickers=AAPL&tickers=MSFT`).
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: stock_ids
        in: query
        description: Stock ID(s) to filter by. Can be used instead of or together with `tickers`.
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: doc_type
        in: query
        description: Document type filter (e.g., `filing`, `earnings_call`)
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: doc_sub_type
        in: query
        description: Document sub-type filter (e.g., `10-K`, `10-Q`, `annual_report`, `press_release`)
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: fiscal_period
        in: query
        description: Fiscal period filter. Use nested object notation in the query string (e.g., `fiscal_period[start_time][year]=2024&fiscal_period[start_time][quarter]=1`).
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            start_time:
              type: object
              properties:
                year:
                  type: integer
                  description: Fiscal period start year
                  example: 2023
                quarter:
                  type: integer
                  description: Fiscal period start quarter (1-4)
                  minimum: 1
                  maximum: 4
                  example: 1
            end_time:
              type: object
              properties:
                year:
                  type: integer
                  description: Fiscal period end year
                  example: 2024
                quarter:
                  type: integer
                  description: Fiscal period end quarter (1-4)
                  minimum: 1
                  maximum: 4
                  example: 4
      - name: calendar_period
        in: query
        description: Calendar period filter. Use nested object notation in the query string (e.g., `calendar_period[start_time][year]=2025&calendar_period[start_time][month]=1`).
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            start_time:
              type: object
              properties:
                year:
                  type: integer
                  description: Calendar period start year
                  example: 2025
                month:
                  type: integer
                  description: Calendar period start month (1-12)
                  minimum: 1
                  maximum: 12
                  example: 1
                day:
                  type: integer
                  description: Calendar period start day (1-31, optional — defaults to 1)
                  minimum: 1
                  maximum: 31
                  example: 1
            end_time:
              type: object
              properties:
                year:
                  type: integer
                  description: Calendar period end year
                  example: 2025
                month:
                  type: integer
                  description: Calendar period end month (1-12)
                  minimum: 1
                  maximum: 12
                  example: 12
                day:
                  type: integer
                  description: Calendar period end day (1-31, optional — defaults to 1)
                  minimum: 1
                  maximum: 31
                  example: 31
      - name: page
        in: query
        description: 'Page number (default: 1)'
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        description: 'Number of results per page (default: 20, max: 200)'
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      responses:
        '200':
          description: Batch presigned URLs with document metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    nullable: true
                  payload:
                    type: object
                    properties:
                      documents:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Document ID
                            ticker:
                              type: string
                              nullable: true
                              description: Ticker symbol
                            doc_type:
                              type: string
                              nullable: true
                              description: Document type (e.g., filing, earnings_call)
                            doc_sub_type:
                              type: string
                              nullable: true
                              description: Document sub-type (e.g., 10-K, press_release)
                            name:
                              type: string
                              nullable: true
                              description: Document name
                            fiscal_date:
                              type: string
                              format: date
                              nullable: true
                              description: Fiscal period end date
                            calendar_date:
                              type: string
                              format: date
                              nullable: true
                              description: Calendar date
                            published_at:
                              type: string
                              format: date-time
                              nullable: true
                              description: Publication date
                            presigned_url:
                              type: string
                              description: Temporary presigned URL for document access
                      total_count:
                        type: integer
                        description: Total number of matching documents
                      page:
                        type: integer
                        description: Current page number
                      per_page:
                        type: integer
                        description: Results per page
                      has_more:
                        type: boolean
                        description: Whether there are more pages
                      skipped_count:
                        type: integer
                        description: Number of documents without downloadable files
              example:
                error: null
                payload:
                  documents:
                  - id: 123e4567-e89b-12d3-a456-426614174000
                    ticker: AAPL
                    doc_type: filing
                    doc_sub_type: 10-K
                    name: Q4 2024 Apple Inc.
                    fiscal_date: '2024-12-31'
                    calendar_date: '2025-01-30'
                    published_at: '2025-01-30T16:00:00Z'
                    presigned_url: https://linq-vertex-documents.s3.amazonaws.com/...
                  total_count: 42
                  page: 1
                  per_page: 20
                  has_more: false
                  skipped_count: 3
        '400':
          description: Bad Request - Missing ticker parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: TICKERS_MISSING
                  msg: ticker query parameter is required
                  message: ticker query parameter is required
                payload: null
        '401':
          description: Unauthorized - Invalid API key or authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: API_KEY_MISSING
                  msg: header does not contain api key
                  message: header does not contain api key
                payload: null
      tags:
      - Data
  /v2/documents/{document_id}/presigned_url:
    get:
      summary: Presigned URL V2
      description: 'Generates a temporary presigned URL for secure access to a document file. Supports both external documents (filings, transcripts, news) and RMS documents (Third Bridge transcripts, internal notes, EDS content).


        Use `search_type=rms` to access RMS documents. Default is `external` (same behavior as V1).


        For platform API keys, pass `organization_id` to specify which org''s documents to query. If omitted, defaults to the API key''s primary organization.'
      parameters:
      - name: document_id
        in: path
        description: Document ID (from search/analytics references)
        required: true
        schema:
          type: string
      - name: search_type
        in: query
        description: Document source. `external` (default) returns external documents. `rms` returns documents from your Research Management System (RMS).
        required: false
        schema:
          type: string
          enum:
          - external
          - rms
          default: external
      - name: organization_id
        in: query
        description: Organization ID. Recommended for `search_type=rms` and required for platform API keys. If omitted, defaults to the API key's primary organization.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Presigned URL with document metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    nullable: true
                  payload:
                    type: object
                    properties:
                      document_id:
                        type: string
                        description: Document ID
                      document_name:
                        type: string
                        nullable: true
                        description: Document filename. Populated for RMS, null for external.
                      presigned_url:
                        type: string
                        description: Temporary download URL
                      expiration_seconds:
                        type: integer
                        nullable: true
                        description: URL validity in seconds. 3600 for RMS, null for external.
              example:
                error: null
                payload:
                  document_id: 123e4567-e89b-12d3-a456-426614174000
                  document_name: document.pdf
                  presigned_url: https://example.s3.amazonaws.com/...
                  expiration_seconds: 3600
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: INVALID_REQUEST_BODY
                  msg: organization_id is required when search_type is rms
                  message: organization_id is required when search_type is rms
                payload: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
      - Data
  /v2/documents/presigned_urls:
    get:
      summary: Batch Presigned URLs V2
      description: 'Generates temporary presigned URLs for multiple documents. Supports both external documents and RMS documents via the `search_type` parameter.


        **Two modes:**

        - **By document IDs** (RMS only): Pass `document_ids` to get presigned URLs for specific documents from search/analytics references.

        - **By filters**: Pass `tickers`, `doc_type`, etc. to browse and get presigned URLs.


        For platform API keys, pass `organization_id` to specify which org to query.'
      parameters:
      - name: search_type
        in: query
        description: Document source. `external` (default) returns external documents. `rms` returns documents from your Research Management System (RMS).
        required: false
        schema:
          type: string
          enum:
          - external
          - rms
          default: external
      - name: organization_id
        in: query
        description: Organization ID. Recommended for `search_type=rms` and required for platform API keys.
        required: false
        schema:
          type: string
      - name: tickers
        in: query
        description: Ticker symbol(s). Use multiple params for multiple tickers (e.g., `?tickers=AAPL&tickers=MSFT`).
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: stock_ids
        in: query
        description: Stock ID(s). Can be used instead of or together with tickers.
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: document_ids
        in: query
        description: Document ID(s) for batch lookup. **RMS only** — not supported for `search_type=external`.
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: doc_type
        in: query
        description: Document type filter. Valid values differ by `search_type` and organization.
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: doc_sub_type
        in: query
        description: Document sub-type filter. Valid values differ by `search_type` and organization.
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: fiscal_period
        in: query
        description: 'Fiscal period filter. Use nested notation: `fiscal_period[start_time][year]=2024&fiscal_period[start_time][quarter]=1`.'
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            start_time:
              type: object
              properties:
                year:
                  type: integer
                  example: 2024
                quarter:
                  type: integer
                  minimum: 1
                  maximum: 4
                  example: 1
            end_time:
              type: object
              properties:
                year:
                  type: integer
                  example: 2025
                quarter:
                  type: integer
                  minimum: 1
                  maximum: 4
                  example: 4
      - name: calendar_period
        in: query
        description: 'Calendar period filter. Use nested notation: `calendar_period[start_time][year]=2025&calendar_period[start_time][month]=1`.'
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            start_time:
              type: object
              properties:
                year:
                  type: integer
                  example: 2025
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                  example: 1
                day:
                  type: integer
                  minimum: 1
                  maximum: 31
                  example: 1
            end_time:
              type: object
              properties:
                year:
                  type: integer
                  example: 2025
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                  example: 12
                day:
                  type: integer
                  minimum: 1
                  maximum: 31
                  example: 31
      - name: page
        in: query
        description: 'Page number (default: 1)'
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        description: 'Results per page (default: 20, max: 200)'
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      responses:
        '200':
          description: Batch presigned URLs with document metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    nullable: true
                  payload:
                    type: object
                    properties:
                      documents:
                        type: array
                        items:
                          type: object
                          properties:
                            document_id:
                              type: string
                              description: Document ID
                            document_name:
                              type: string
                              nullable: true
                              description: Document filename
                            ticker:
                              type: string
                              nullable: true
                              description: Primary ticker
                            doc_type:
                              type: string
                              nullable: true
                              description: Document type
                            doc_sub_type:
                              type: string
                              nullable: true
                              description: Document sub-type
                            source:
                              type: string
                              nullable: true
                              description: Source type (RMS only, e.g. thirdBridge)
                            fiscal_date:
                              type: string
                              nullable: true
                              description: Fiscal period
                            calendar_date:
                              type: string
                              nullable: true
                              description: Calendar date
                            published_at:
                              type: string
                              nullable: true
                              description: Publication date
                            presigned_url:
                              type: string
                              description: Temporary download URL
                            expiration_seconds:
                              type: integer
                              nullable: true
                              description: URL validity. 3600 for RMS, null for external.
                      total_count:
                        type: integer
                        description: Total matching documents
                      page:
                        type: integer
                        description: Current page
                      per_page:
                        type: integer
                        description: Results per page
                      has_more:
                        type: boolean
                        description: Whether more pages exist
                      skipped_count:
                        type: integer
                        description: Documents without downloadable files
              example:
                error: null
                payload:
                  documents:
                  - document_id: 123e4567-e89b-12d3-a456-426614174000
                    document_name: document.pdf
                    ticker: AAPL
                    doc_type: filing
                    doc_sub_type: 10-K
                    source: null
                    fiscal_date: '2025-12-31'
                    calendar_date: '2026-01-30'
                    published_at: '2026-01-30T16:00:00Z'
                    presigned_url: https://example.s3.amazonaws.com/...
                    expiration_seconds: null
                  total_count: 8234
                  page: 1
                  per_page: 20
                  has_more: true
                  skipped_count: 0
        '400':
          description: Bad Request - Missing required filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: INVALID_REQUEST_BODY
                  msg: At least one of tickers, stock_ids, or document_ids is required for rms search
                  message: At least one of tickers, stock_ids, or document_ids is required for rms search
                payload: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
      - Data
components:
  schemas:
    CustomMetadata:
      type: object
      nullable: true
      description: User-defined metadata. This field may contain additional structured data based on the document type and user configuration.
      properties:
        edgar_metadata:
          type: object
          description: SEC EDGAR filing metadata. This field is only available for SEC filing documents and is provided upon request. Not all users will have access to this data. Contact support@linqalpha.com to enable EDGAR metadata for your organization.
          properties:
            public_url:
              type: string
              format: uri
              description: Public EDGAR URL to the source filing document on the SEC website
              example: https://www.sec.gov/Archives/edgar/data/1045810/000104581023000227/nvda-20231029.htm
            accession_number:
              type: string
              description: 'SEC accession number uniquely identifying the filing. Format: XXXXXXXXXX-XX-XXXXXX'
              example: 0001045810-23-000227
              pattern: ^\d{10}-\d{2}-\d{6}$
            filing_values:
              type: object
              description: Additional SEC filing identifiers
              properties:
                film_number:
                  type: string
                  description: SEC film number assigned to the filing
                  example: '231428716'
                sec_file_number:
                  type: string
                  description: SEC file number for the registrant
                  example: 000-23985
          required:
          - public_url
          - accession_number
    AnalyticsReferencesResponse:
      type: object
      description: Wrapper for analytics references response (normalized format). The payload contains a list of references with enriched metadata.
      properties:
        error:
          type: object
          nullable: true
          description: Error object. Null on success.
        payload:
          type: object
          nullable: true
          properties:
            references:
              type: array
              items:
                type: object
                description: Reference in normalized format with enriched metadata
                properties:
                  id:
                    type: string
                    description: Citation index as string (e.g., "1")
                  citation_idx:
                    type: string
                    description: Citation index as string
                  search_type:
                    type: string
                    enum:
                    - rms
                    - external
                    description: Source type
                  chunk_id:
                    type: string
                    description: Chunk identifier
                  text:
                    type: string
                    description: Reference text content
                  text_type:
                    type: string
                    enum:
                    - paragraph
                    - table
                    - image
                    - news
                    description: Content type
                  document_id:
                    type: string
                    description: Source document ID
                  document_name:
                    type: string
                    description: Document title
                  s3_file_key:
                    type: string
                    nullable: true
                    description: S3 file path for document download
                  external_url:
                    type: string
                    nullable: true
                    description: External URL for the document
                  metadata:
                    type: object
                    description: Enriched metadata with financial and document classification fields
                    properties:
                      calendar_date:
                        type: string
                        nullable: true
                        description: Publication or event date
                      fiscal_year:
                        type: integer
                        nullable: true
                      fiscal_quarter:
                        type: integer
                        nullable: true
                      source:
                        type: string
                        nullable: true
                      tickers:
                        type: array
                        items:
                          type: string
                        nullable: true
                      company_names:
                        type: array
                        items:
                          type: string
                        nullable: true
                      stock_ids:
                        type: array
                        items:
                          type: string
                        nullable: true
                      document_category:
                        type: string
                        nullable: true
                      document_subcategory:
                        type: string
                        nullable: true
                      rms_document_type:
                        type: string
                        nullable: true
                      rms_type:
                        type: string
                        nullable: true
                      rms_sub_type:
                        type: string
                        nullable: true
                      sector:
                        type: array
                        items:
                          type: string
                        nullable: true
                      subsector:
                        type: array
                        items:
                          type: string
                        nullable: true
                      publisher:
                        type: string
                        nullable: true
                      countries:
                        type: array
                        items:
                          type: string
                        nullable: true
                      regions:
                        type: array
                        items:
                          type: string
                        nullable: true
                      participants:
                        type: array
                        nullable: true
                      tags:
                        type: array
                        items:
                          type: string
                        nullable: true
                      offset:
                        type: array
                        nullable: true
                      parent_id:
                        type: string
                        nullable: true
                        description: Parent document ID
                      parent_document_id:
                        type: string
                        nullable: true
                        description: Parent document ID (same as parent_id)
                      creation_timestamp:
                        type: string
                        nullable: true
                        description: Document creation timestamp (ISO 8601)
                      last_contribution_timestamp:
                        type: string
                        nullable: true
                        description: Last modification timestamp (ISO 8601)
                      document_tags:
                        type: array
                        items:
                          type: string
                        nullable: true
                        description: Document classification tags (e.g. research_report, brokerage)
                      creator_name:
                        type: string
                        nullable: true
                        description: Document creator name
                      last_contributor_name:
                        type: string
                        nullable: true
                        description: Last contributor name
                  custom_metadata:
                    type: object
                    nullable: true
                    description: Additional custom metadata
    ApiError:
      type: object
      properties:
        code:
          type: string
          description: 'Error code indicating the type of error. Common codes:

            - Authentication: `API_KEY_MISSING`, `INVALID_API_KEY`

            - Validation: `INVALID_REQUEST_BODY`, `ORGANIZATION_ID_MISSING`, `TICKERS_MISSING`, `CHAT_MESSAGE_ID_MISSING`, `DOCUMENT_ID_MISSING`

            - Service: `SEARCH_FAIL`, `TTS_FAIL`, `CREATE_CONV_FAIL`, `GET_STOCK_FAIL`, `CREATE_MSG_FAIL`, `ALPHA_COMP_FAIL`, `GET_REF_FAIL`

            - Connectors: `CONNECTOR_LIST_FAIL`, `CONNECTOR_NOT_FOUND`, `CONNECTOR_CREATE_FAIL`, `CONNECTOR_UPDATE_FAIL`, `CONNECTOR_DELETE_FAIL`, `CONNECTOR_TEST_FAIL`

            - Not Found: `NOT_FOUND`'
          example: INVALID_REQUEST_BODY
        msg:
          type: string
          description: Error message (deprecated, use `message` instead)
          example: query is required and must be a string
        message:
          type: string
          description: Error message providing more details about the error
          example: query is required and must be a string
      required:
      - code
    EarningsScheduleEvent:
      type: object
      required:
      - stock_id
      - stock_name
      - event_datetime
      - direction
      - is_estimated
      properties:
        stock_id:
          type: string
          description: Bloomberg Global ID of the company
          example: BBG001S5N8V8
        stock_name:
          type: string
          description: Company name
          example: Apple Inc.
        event_datetime:
          type: string
          description: Earnings-call / release datetime (ISO 8601)
          example: '2026-07-30T00:00:00'
        direction:
          type: string
          enum:
          - prior
          - upcoming
          description: Whether the event is in the past (prior) or future (upcoming) relative to now
        is_estimated:
          type: boolean
          description: True when the date is a vendor projection rather than a confirmed/announced date. Always false for prior events; only ever true for upcoming events.
          example: true
        fiscal_date:
          type: string
          format: date
          nullable: true
          description: Fiscal period the event reports on
          example: '2026-09-30'
        link:
          type: string
          nullable: true
          description: Webcast link, if available
        event_description:
          type: string
          nullable: true
          description: Human-readable event description
          example: Q3 2026 Earnings Release (Projected)
    ReferencesResponse:
      type: object
      properties:
        references:
          type: array
          items:
            $ref: '#/components/schemas/RMSReference'
          description: References
      required:
      - references
    ChatMessageResponse:
      type: object
      properties:
        chat_message_id:
          type: string
          format: uuid
          description: Chat message ID
        message:
          type: string
          description: Chat message
        message_type:
          type: string
          description: Chat message type
          enum:
          - assistant
          - user
          - think
          example: assistant
        created_at:
          type: string
          description: Chat message created at
          example: '2025-10-30T09:11:31.667544Z'
    TtsResponse:
      type: object
      required:
      - code
      - success
      - message
      - response
      properties:
        code:
          type: integer
          description: Response code (0 for success)
          example: 0
        success:
          type: boolean
          description: Indicates whether the request was successful
          example: true
        message:
          type: string
          description: Response message
          example: success
        response:
          $ref: '#/components/schemas/TtsQueryResult'
    TtsQueryResult:
      type: object
      required:
      - execution_id
      - rdb_result
      properties:
        execution_id:
          type: string
          format: uuid
          description: Unique identifier for the query execution
          example: 2548d578-0446-4abc-b6f6-f50c966d341c
        stock_name_mapping:
          type: object
          additionalProperties:
            type: string
          description: Mapping of stock IDs to company names
          example:
            BBG001S5TZJ6: NVIDIA Corporation
        currency_info:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyInfo'
          description: Currency information for each stock
        field_currency_info:
          type: object
          additionalProperties:
            type: string
          description: Currency information for each field
          example:
            BBG001S6Q004:
              SALES: TWD
              EPS: TWD
              ff_sales: TWD
        execution_duration:
          type: number
          description: Execution duration in milliseconds
        date_range:
          type: array
          items:
            type: string
            format: date
          minItems: 2
          maxItems: 2
          description: Date range for the query [start_date, end_date]
          example:
          - '2024-01-01'
          - '2024-12-31'
        rdb_result:
          type: string
          description: Query results formatted as markdown tables
          example: '### Company Annual Financials


            | name | Fiscal Period End Date | Dividends Per Share |

            | --- | --- | --- |

            | NVIDIA Corporation | 2024-01-31 | 0.016 |'
        earnings_schedule:
          type: array
          items:
            $ref: '#/components/schemas/EarningsScheduleEvent'
          description: Prior/upcoming earnings-call schedule events for the resolved companies, returned when the query asks for earnings-call dates (e.g. "When does Apple next report?"). Returned only for organizations entitled to earnings-call schedule retrieval; omitted entirely for all other organizations.
        earnings_schedule_truncated:
          type: boolean
          description: True when an unbounded universe scan ("which companies report this week?") was capped by a load/window limit, so the returned list is partial. Always false for company-specific queries. Present only alongside earnings_schedule.
    ReferenceMetadata:
      type: object
      description: Additional metadata information
      properties:
        source:
          type: string
          nullable: true
          example: news
        rms_type:
          type: string
          enum:
          - emailnotes
          - generalnotes
          - templatednotes
          - custom-data
          - structured-data
          - public_transcript
          - private_transcript
          nullable: true
        rms_sub_type:
          type: string
          nullable: true
        rms_document_type:
          type: string
          enum:
          - note
          - attachment
          nullable: true
        parent_id:
          type: string
          nullable: true
        parent_document_id:
          type: string
          nullable: true
        countries:
          type: array
          items:
            type: string
          nullable: true
        regions:
          type: array
