    CurrencyInfo:
      type: object
      required:
      - currency
      - exchange_rate
      properties:
        currency:
          type: string
          description: Currency code (ISO 4217)
          example: USD
        exchange_rate:
          type: number
          description: Exchange rate to base currency
          example: 1
    ReferenceV2:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Reference ID
        citation_idx:
          type: integer
          description: Citation index number
        search_type:
          type: string
          description: Type of search that produced this reference (e.g., "rms")
        chunk_id:
          type: string
          description: Chunk identifier
        text:
          type: string
          description: Reference text content
        text_type:
          type: string
          description: Type of text (e.g., "paragraph")
        document_id:
          type: string
          format: uuid
          description: Document ID. Use with presigned_url endpoint for direct download.
        document_name:
          type: string
          description: Document name
        s3_file_key:
          type: string
          nullable: true
          description: S3 file key (may be null)
        external_url:
          type: string
          description: External URL for the document
        metadata:
          $ref: '#/components/schemas/ReferenceMetadataV2'
      required:
      - id
      - citation_idx
      - search_type
      - chunk_id
      - text
      - text_type
      - document_id
      - document_name
      - s3_file_key
      - external_url
      - metadata
    RMSReference:
      type: object
      properties:
        id:
          type: string
          description: Reference citation index (will be deprecated in the future)
          example: 123e4567-e89b-12d3-a456-426614174000
        citation_idx:
          type: string
          description: Reference citation index
          example: 123e4567-e89b-12d3-a456-426614174000
        search_type:
          type: string
          enum:
          - rms
          - external
          description: Type of search used
          example: rms
        chunk_id:
          type: string
          format: uuid
          description: ID of the chunk this reference belongs to
        text:
          type: string
          description: Exact text content of the matching chunk retrieved during search and used in the final answer. This is the precise segment of the source document that the model cited as evidence.
        text_type:
          type: string
          enum:
          - paragraph
          - table
          - image
          - news
          description: Type of text content
        document_id:
          type: string
          format: uuid
          description: Document ID that this reference points to
        document_name:
          type: string
          description: Human-readable document name
        s3_file_key:
          type: string
          description: S3 file path for the document
        external_url:
          type: string
          description: External S3 URL to access the document
        metadata:
          $ref: '#/components/schemas/ReferenceMetadata'
        custom_metadata:
          $ref: '#/components/schemas/CustomMetadata'
      required:
      - id
      - citation_idx
      - search_type
      - chunk_id
      - text
      - text_type
      - document_name
      - external_url
      - metadata
    ApiErrorResponse:
      type: object
      description: Standard error response wrapper
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
        payload:
          description: Always null for error responses
          nullable: true
      required:
      - error
      - payload
    TtsRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          description: Natural language query to be converted to SQL
          example: Show me NVIDIA's quarterly revenue and net income for 2024
