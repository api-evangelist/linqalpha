aid: linqalpha
name: LinqAlpha
description: >-
  LinqAlpha is a domain-specialized multi-agent AI platform for institutional investment research,
  serving hedge funds, asset managers and investment banks. It runs retrieval-augmented, agentic
  analysis across SEC filings, earnings-call transcripts, IR materials, news and macroeconomic data
  covering 57,600+ companies in 120+ countries and 30+ languages, returning answers with inline
  citations that resolve to the exact source chunks. The LinqAlpha API exposes that engine over a
  REST surface at api.linqalpha.com — streaming analytics and chat over Server-Sent Events,
  document search, natural-language-to-SQL, scheduled research briefings, an RMS/Vault ingestion
  path for a firm's own internal documents, and a source-grounding judge that scores how well each
  claim in an answer is backed by the sources it cited. LinqAlpha also publishes a first-party
  remote MCP server exposing 22 financial-data tools to AI assistants.
